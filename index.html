<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>OneMap - เทศบาลตำบลแม่ยาว</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>

html, body {
  height: 100%;
  margin: 0;
  font-family: "TH Sarabun New", sans-serif;
}

#map {
  height: 100%;
  width: 100%;
}

/* โลโก้ */

.logo{
  position:absolute;
  top:5px;
  left:10px;
  z-index:1500;
  background:white;
  border-radius:8px;
  padding:3px;
  box-shadow:0 0 5px rgba(0,0,0,0.3);
}

.logo img{
  width:70px;
  height:70px;
  cursor:pointer;
}

/* zoom */

.leaflet-top.leaflet-left{
  top:90px !important;
}

/* เข็มทิศ */

.compass{
  position:absolute;
  top:10px;
  right:10px;
  z-index:1500;
  background:white;
  border-radius:50%;
  width:50px;
  height:50px;
  box-shadow:0 0 6px rgba(0,0,0,0.3);
  display:flex;
  align-items:center;
  justify-content:center;
}

.compass img{
  width:40px;
  height:40px;
}

/* ปุ่ม panel */

.toggle-panel-btn{
  position:absolute;
  top:70px;
  right:10px;
  z-index:1500;
  background:white;
  border:1px solid #999;
  border-radius:6px;
  padding:5px 10px;
  font-size:15px;
  cursor:pointer;
}

/* panel */

.layer-panel{
  position:absolute;
  top:110px;
  right:10px;
  z-index:1400;
  background:white;
  border:1px solid #aaa;
  border-radius:8px;
  padding:10px;
  width:300px;
  max-height:500px;
  overflow-y:auto;
  display:none;
  box-shadow:0 0 6px rgba(0,0,0,0.2);
}

.group-title{
  margin-top:10px;
  padding:5px;
  background:#f0f0f0;
  border-radius:5px;
  font-weight:bold;
}

.layer-item{
  margin-left:10px;
  margin-top:5px;
}

/* ปุ่มล่าง */

.bottom-left-controls{
  position:absolute;
  bottom:10px;
  left:10px;
  z-index:1000;
  display:flex;
  gap:10px;
}

button{
  background:white;
  border:1px solid #999;
  border-radius:6px;
  padding:5px 10px;
  font-size:15px;
  cursor:pointer;
}

.coordinate{
  position:absolute;
  bottom:10px;
  left:270px;
  z-index:1000;
  background:white;
  padding:5px 10px;
  border-radius:6px;
  border:1px solid #999;
  font-size:16px;
}

</style>

</head>

<body>

<div class="logo"
onclick="window.open('https://www.maeyao.go.th/','_blank')">
<img src="assets/logo.png">
</div>

<div class="compass">
<img src="assets/compass.png">
</div>

<button class="toggle-panel-btn"
onclick="toggleLayerPanel()">
ชั้นข้อมูล
</button>

<div class="layer-panel" id="layerPanel">

<b>แผนที่ฐาน</b><br>

<label>
<input type="radio"
name="base"
value="osm"
checked>
OpenStreetMap
</label>

<br>

<label>
<input type="radio"
name="base"
value="sat">
Google Satellite
</label>

<hr>

<div id="layerList"></div>

</div>

<div class="bottom-left-controls">

<button id="resetView">
รีเซตมุมมอง
</button>

<button id="locateMe">
ตำแหน่งฉัน
</button>

</div>

<div class="coordinate" id="coordinate">
E: -, N: -
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet-omnivore/0.3.4/leaflet-omnivore.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/proj4js/2.8.0/proj4.js"></script>

<script>

const map = L.map('map',{
  center:[19.95,99.80],
  zoom:12
});

const osm = L.tileLayer(
'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
{maxZoom:19}
).addTo(map);

const sat = L.tileLayer(
'https://mt1.google.com/vt/lyrs=s&x={x}&y={y}&z={z}',
{maxZoom:20}
);

document
.querySelectorAll('input[name="base"]')
.forEach(r=>{

  r.addEventListener('change',()=>{

    map.removeLayer(osm);
    map.removeLayer(sat);

    if(r.value==='osm'){
      osm.addTo(map);
    }else{
      sat.addTo(map);
    }

  });

});

fetch("layers/config.json")

.then(r=>r.json())

.then(configs=>{

  const layerList =
  document.getElementById("layerList");

  const groups = {};

  configs.forEach((cfg,i)=>{

    if(!groups[cfg.group]){
      groups[cfg.group]=[];
    }

    groups[cfg.group].push(cfg);

  });

  Object.keys(groups).forEach(groupName=>{

    const title =
    document.createElement("div");

    title.className="group-title";
    title.innerText=groupName;

    layerList.appendChild(title);

    groups[groupName].forEach((cfg,i)=>{

      const color =
      cfg.color || "#ff0000";

      const layer =
      omnivore.kml(

        "layers/" + cfg.file,

        null,

        L.geoJson(null,{

          style:()=>({

            color:color,
            weight:2,
            fillColor:color,
            fillOpacity:cfg.opacity || 0.6

          }),

          pointToLayer:(f,latlng)=>

          L.circleMarker(latlng,{

            radius:6,
            color:color,
            fillColor:color,
            fillOpacity:cfg.opacity || 0.6

          })

        })

      );

      const div =
      document.createElement("div");

      div.className="layer-item";

      div.innerHTML=`

      <label>

      <input type="checkbox">

      ${cfg.name}

      </label>

      `;

      const chk =
      div.querySelector("input");

      if(cfg.visible){

        chk.checked=true;

        layer.addTo(map);

      }

      chk.addEventListener("change",()=>{

        if(chk.checked){

          layer.addTo(map);

        }else{

          map.removeLayer(layer);

        }

      });

      layerList.appendChild(div);

    });

  });

});

function toggleLayerPanel(){

  const p =
  document.getElementById('layerPanel');

  p.style.display =

  (p.style.display==='none' ||
   p.style.display==='')

  ? 'block'
  : 'none';

}

document
.getElementById('resetView')

.addEventListener('click',()=>{

  map.setView([19.95,99.80],12);

});

let locateMarker = null;

document
.getElementById('locateMe')

.addEventListener('click',()=>{

  map.locate({
    setView:true,
    maxZoom:16
  });

});

map.on('locationfound',e=>{

  if(locateMarker){
    map.removeLayer(locateMarker);
  }

  locateMarker =
  L.marker(e.latlng)

  .addTo(map)

  .bindPopup("ตำแหน่งของคุณ")

  .openPopup();

});

map.on('mousemove',e=>{

  const utm = proj4(

    "+proj=utm +zone=47 +ellps=WGS84 +units=m +no_defs",

    [e.latlng.lng,e.latlng.lat]

  );

  document
  .getElementById('coordinate')

  .innerText =

  `E: ${utm[0].toFixed(2)},
   N: ${utm[1].toFixed(2)}`;

});

L.control.scale({
  position:'bottomright',
  imperial:false
}).addTo(map);

</script>

</body>
</html>
